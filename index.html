    <script>
      // Keep the embedded merge game at its natural height on mobile/desktop.
      window.addEventListener('message', function(event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'bakehouse:game-height') return;
        var h = Number(event.data.height);
        if (!Number.isFinite(h) || h < 250 || h > 5000) return;
        document.querySelectorAll('iframe[src*="game.html?embedded=1"]').forEach(function(frame) {
          if (event.source === frame.contentWindow) frame.style.height = (h + 2) + 'px';
        });
      });
    </script>
    <script>
      // Scroll to top only when the route actually changes.
      // Never keep forcing the scroll position while the visitor scrolls.
      (function () {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var lastRoute = location.hash;
        var sequence = 0;
        function goTopAfterNavigation() {
          var thisSequence = ++sequence;
          // React renders the destination during the next animation frame.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              if (thisSequence !== sequence) return;
              window.scrollTo({top: 0, left: 0, behavior: 'instant'});
            });
          });
        }
        window.addEventListener('hashchange', function () {
          if (location.hash === lastRoute) return;
          lastRoute = location.hash;
          goTopAfterNavigation();
        });
        // Direct visits to a nested page should start from its beginning.
        window.addEventListener('pageshow', function (event) {
          if (event.persisted) return;
          if (location.hash && location.hash !== '#/') goTopAfterNavigation();
        });
      })();
    </script>
