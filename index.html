    <script>
      // Keep the embedded merge game at its natural height on mobile/desktop.
      window.addEventListener('message', function(event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'bakehouse:game-height') return;
        var h = Number(event.data.height);
        if (!Number.isFinite(h) || h < 250 || h > 5000) return;
        document.querySelectorAll('iframe[src*="game.html?embedded=1"]').forEach(function(frame) {
          if (event.source === frame.contentWindow) frame.style.height = (h + 2) + 'px';
        });
      });
    </script>
    <script>
      // Reset SPA navigation at the moment a link is clicked and after React renders.
      (function(){
        if ('scrollRestoration' in history) history.scrollRestoration='manual';
        var token=0, previous=location.hash;
        function topNow(){
          window.scrollTo({left:0,top:0,behavior:'instant'});
          document.documentElement.scrollTop=0;
          document.body.scrollTop=0;
        }
        function reset(){
          var id=++token;
          document.documentElement.classList.add('route-resetting');
          topNow();
          // Render, images and font swapping can move the viewport after navigation.
          [0,16,50,120,250,450,750,1150,1750,2300].forEach(function(t){
            setTimeout(function(){if(id!==token)return;topNow();if(t===2300)document.documentElement.classList.remove('route-resetting')},t);
          });
        }
        // React Router's Link uses click handlers before the hashchange occurs.
        document.addEventListener('click',function(e){
          if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
          var link=e.target.closest&&e.target.closest('a[href]');
          if(!link)return;
          var url;
          try{url=new URL(link.href,location.href)}catch(_){return}
          if(url.origin!==location.origin||url.pathname!==location.pathname)return;
          if(url.hash && url.hash!==location.hash && url.hash.startsWith('#/')) reset();
        },true);
        window.addEventListener('hashchange',function(){if(location.hash!==previous){previous=location.hash;reset()}});
        window.addEventListener('popstate',reset);
        // Handle first load via a deep link too.
        if(location.hash && location.hash!=='#/')window.addEventListener('load',reset,{once:true});
      })();
    </script>
    <style>html.route-resetting,html.route-resetting body{scroll-behavior:auto!important;scroll-snap-type:none!important}</style>
  </head>
  <body>
    <div id="root"></div>
  </body>
