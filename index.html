    <script>
      // Keep the embedded merge game at its natural height on mobile/desktop.
      window.addEventListener('message', function(event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'bakehouse:game-height') return;
        var h = Number(event.data.height);
        if (!Number.isFinite(h) || h < 250 || h > 5000) return;
        document.querySelectorAll('iframe[src*="game.html?embedded=1"]').forEach(function(frame) {
          if (event.source === frame.contentWindow) frame.style.height = (h + 2) + 'px';
        });
      });
    </script>
    <script>
      // Scroll correction for the React hash router, including delayed route rendering.
      (function () {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var currentRoute = location.hash;
        var navigationId = 0;
        var observer;
        function toTop() {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
          var root = document.getElementById('root');
          if (root && root.scrollTop) root.scrollTop = 0;
        }
        function onRouteChange() {
          if (location.hash === currentRoute) return;
          currentRoute = location.hash;
          var id = ++navigationId;
          if (observer) observer.disconnect();
          toTop();
          // The route is rendered after hashchange, images and React state can
          // cause layout reflow. Keep correcting briefly, not indefinitely.
          var root = document.getElementById('root');
          if (root) {
            observer = new MutationObserver(function () {
              if (id === navigationId) toTop();
            });
            observer.observe(root, {childList:true,subtree:false});
          }
          [0, 32, 100, 250, 500, 850, 1300].forEach(function (delay) {
            setTimeout(function () {
              if (id !== navigationId) return;
              toTop();
              if (delay === 1300 && observer) observer.disconnect();
            }, delay);
          });
        }
        window.addEventListener('hashchange', onRouteChange);
        window.addEventListener('popstate', onRouteChange);
      })();
    </script>

  <body>
    <div id="root"></div>
