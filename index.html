    <script>
      // Keep the embedded merge game at its natural height on mobile/desktop.
      window.addEventListener('message', function(event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'bakehouse:game-height') return;
        var h = Number(event.data.height);
        if (!Number.isFinite(h) || h < 250 || h > 5000) return;
        document.querySelectorAll('iframe[src*="game.html?embedded=1"]').forEach(function(frame) {
          if (event.source === frame.contentWindow) frame.style.height = (h + 2) + 'px';
        });
      });
    </script>
    <script>
      // React hash routes reuse the same document, so explicitly reset scroll
      // when navigating to a different page (including a product detail).
      (function () {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        let lastRoute = window.location.hash;
        let navigationToken = 0;
        function resetScroll() {
          window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        }
        window.addEventListener('hashchange', function () {
          const newRoute = window.location.hash;
          if (newRoute === lastRoute || !newRoute.startsWith('#/')) return;
          lastRoute = newRoute;
          const token = ++navigationToken;
          resetScroll();
          // Allow the React route to paint before resetting the new page.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              if (token === navigationToken) resetScroll();
            });
          });
          setTimeout(function () {
            if (token === navigationToken) resetScroll();
          }, 120);
        });
      })();
    </script>
